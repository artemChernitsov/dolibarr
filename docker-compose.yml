version: "3.8"

services:
  app:
    build: .
    container_name: dolibarr_app
    restart: unless-stopped
    depends_on:
      - db
    environment:          # Handy for copy‑pasting into the Dolibarr installer
      DOLI_DB_HOST: db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolipass
      # ── Xdebug / VS Code integration ─────────────────────────
      PHP_IDE_CONFIG: "serverName=docker"
      XDEBUG_MODE: "debug,develop"   # set to "off" to disable Xdebug quickly
    ports:
      - "8080:80"
    volumes:
      # Bind‑mount the whole project so edits on the host are live in the container
      - ./:/var/www/dolibarr:rw
      # Separate, persistent storage for /documents
      - documents_data:/var/www/dolibarr/documents
    # Ensure host.docker.internal resolves on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:16
    container_name: dolibarr_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dolibarr
      POSTGRES_USER: dolibarr
      POSTGRES_PASSWORD: dolipass
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: dolibarr_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

# ──────────────────────────────
# Named‑volume declarations
# ──────────────────────────────
volumes:
  pg_data: {}
  documents_data: {}
  pgadmin_data: {}